databaseChangeLog:
  - changeSet:
      id: 001-create-drivers
      author: easy-taxi
      context: dev,prod
      changes:
        - createTable:
            tableName: drivers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_drivers
                    nullable: false
              - column:
                  name: available
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-riders
      author: easy-taxi
      context: dev,prod
      changes:
        - createTable:
            tableName: riders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_riders
                    nullable: false
              - column:
                  name: money
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: birth_date
                  type: DATE
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-create-journeys
      author: easy-taxi
      context: dev,prod
      changes:
        - createTable:
            tableName: journeys
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_journeys
                    nullable: false
              - column:
                  name: departure
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: arrival
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: kilometers
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-create-bookings
      author: easy-taxi
      context: dev,prod
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_bookings
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: rider_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: driver_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: journey_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: rider_id
            constraintName: fk_bookings_rider
            referencedTableName: riders
            referencedColumnNames: id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: driver_id
            constraintName: fk_bookings_driver
            referencedTableName: drivers
            referencedColumnNames: id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: journey_id
            constraintName: fk_bookings_journey
            referencedTableName: journeys
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            tableName: bookings
            indexName: idx_bookings_rider_id
            columns:
              - column:
                  name: rider_id
        - createIndex:
            tableName: bookings
            indexName: idx_bookings_driver_id
            columns:
              - column:
                  name: driver_id
        - createIndex:
            tableName: bookings
            indexName: idx_bookings_journey_id
            columns:
              - column:
                  name: journey_id
